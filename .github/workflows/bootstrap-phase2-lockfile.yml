name: Bootstrap Phase 2 pnpm lockfile

on:
  push:
    branches: [phase-02-pathfinding]

permissions:
  contents: write

concurrency:
  group: phase-02-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: phase-02-pathfinding

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm lockfile for Phase 2"
          git push origin HEAD:phase-02-pathfinding
