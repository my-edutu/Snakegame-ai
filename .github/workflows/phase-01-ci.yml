name: Phase 1 Core Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-01-core-engine]

permissions:
  contents: read

concurrency:
  group: phase-01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, determinism
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and deterministic scenario tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Scan engine for forbidden APIs
        run: pnpm check:forbidden

      - name: Verify repeatable headless output
        shell: bash
        run: |
          set -euo pipefail
          pnpm headless | tee /tmp/headless-a.txt
          pnpm headless | tee /tmp/headless-b.txt
          diff -u /tmp/headless-a.txt /tmp/headless-b.txt

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-01-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
