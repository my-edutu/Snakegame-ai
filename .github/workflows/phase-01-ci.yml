name: Snake Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snake-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, determinism
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and deterministic scenario tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Scan deterministic core for forbidden APIs
        run: pnpm check:forbidden

      - name: Verify renderer architecture boundaries
        run: pnpm check:renderer-boundaries

      - name: Verify renderer target resolutions
        run: pnpm renderer:resolution

      - name: Verify renderer 50000-frame soak
        run: pnpm renderer:soak

      - name: Build premium renderer preview
        run: pnpm preview:build

      - name: Upload premium renderer preview
        uses: actions/upload-artifact@v4
        with:
          name: phase-08-render-preview
          path: apps/render-preview/dist
          if-no-files-found: error
          retention-days: 3

      - name: Verify repeatable engine headless output
        shell: bash
        run: |
          set -euo pipefail
          pnpm headless | tee /tmp/headless-engine-a.txt
          pnpm headless | tee /tmp/headless-engine-b.txt
          diff -u /tmp/headless-engine-a.txt /tmp/headless-engine-b.txt

      - name: Verify repeatable AI pathfinding output
        shell: bash
        run: |
          set -euo pipefail
          pnpm headless:ai | tee /tmp/headless-ai-a.txt
          pnpm headless:ai | tee /tmp/headless-ai-b.txt
          diff -u /tmp/headless-ai-a.txt /tmp/headless-ai-b.txt

      - name: Verify repeatable survival reasoning output
        shell: bash
        run: |
          set -euo pipefail
          pnpm headless:survival | tee /tmp/headless-survival-a.txt
          pnpm headless:survival | tee /tmp/headless-survival-b.txt
          diff -u /tmp/headless-survival-a.txt /tmp/headless-survival-b.txt

      - name: Verify repeatable simulation report
        shell: bash
        run: |
          set -euo pipefail
          pnpm simulate:smoke | tee /tmp/simulation-a.json
          pnpm simulate:smoke | tee /tmp/simulation-b.json
          diff -u /tmp/simulation-a.json /tmp/simulation-b.json

      - name: Verify worker-thread equivalence
        run: pnpm simulate:parallel-smoke > /tmp/simulation-parallel.json

      - name: Verify worker failure propagation
        run: pnpm simulate:worker-failure-smoke

      - name: Verify 1000-run bounded batch
        run: pnpm simulate:benchmark1000 > /tmp/simulation-1000.json

      - name: Verify 10000-run command path
        run: pnpm simulate:smoke10000 > /tmp/simulation-10000.json
