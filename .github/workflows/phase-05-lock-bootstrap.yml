name: Phase 5 Lock Bootstrap

on:
  push:
    branches: [phase-05-level-system]

permissions:
  contents: write

concurrency:
  group: phase-05-lock-bootstrap
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-05-level-system
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate pnpm lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: update Phase 5 workspace lockfile'
          git push origin HEAD:phase-05-level-system
