name: Phase 6 Lock Bootstrap

on:
  push:
    branches: [phase-06-failure-engine]

permissions:
  contents: write

concurrency:
  group: phase-06-lock-bootstrap
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-06-failure-engine
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: refresh Phase 6 simulation lockfile'
          git push origin HEAD:phase-06-failure-engine
